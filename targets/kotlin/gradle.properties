# The library's Maven coordinates and POM, which build.gradle.kts reads. The version is
# Prism's, given by the release (-Pversion=X.Y.Z); see the README's Publish section.
group=org.novasoftwarefoundation
pom.name=Prism for Jetpack Compose
pom.description=Prism's design tokens and components for Android, in Jetpack Compose with Material 3, generated from Prism's design.
pom.url=https://github.com/novasoftwarefoundation/prism
pom.license.name=MIT License
pom.license.url=https://github.com/novasoftwarefoundation/prism/blob/main/LICENSE
pom.developer.id=novasoftwarefoundation
pom.developer.name=Nova Software Foundation
pom.developer.url=https://novasoftwarefoundation.org/
pom.scm.url=https://github.com/novasoftwarefoundation/prism
pom.scm.connection=scm:git:https://github.com/novasoftwarefoundation/prism.git

android.useAndroidX=true
org.gradle.jvmargs=-Xmx2g
org.gradle.workers.max=4
