name: CI

on:
  push:
    branches: [main, develop, spec]
  pull_request:

permissions:
  contents: read

jobs:
  kit:
    name: Kit on its own
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          version-file: kit/.tool-versions
          version-type: strict
      # A copy outside the repository proves the kit needs nothing around it.
      - run: cp -R kit "$RUNNER_TEMP/kit"
      - name: The kit knows nothing about Prism's spec
        run: |
          if grep -rniE 'nunito|novasoftwarefoundation|0\.1\.7|Prism\.Tokens|4272EF' "$RUNNER_TEMP/kit"; then
            echo "::error::kit/ mentions Prism's spec or package. Keep Prism-specific values in the root project."
            exit 1
          fi
      - run: mix compile --warnings-as-errors
        working-directory: ${{ runner.temp }}/kit
      - run: mix format --check-formatted
        working-directory: ${{ runner.temp }}/kit
      - run: mix test
        working-directory: ${{ runner.temp }}/kit

  spec:
    name: Prism spec and generated files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          version-file: .tool-versions
          version-type: strict
      - run: mix compile --warnings-as-errors
      - run: mix format --check-formatted
      # The 0.1.7 golden test and the mix.exs / package.json version check.
      - run: mix test
      - run: mix prism.gen.web
      - name: Committed files match the spec
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git status --short
            git diff
            echo "::error::Generated files differ from the spec. Run 'mix prism.gen.web' and commit the result."
            exit 1
          fi

  npm-package:
    name: npm file list
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .tool-versions
      - name: The package ships exactly the reviewed files
        run: |
          npm pack --dry-run --json | jq -r '.[0].files[].path' | LC_ALL=C sort > "$RUNNER_TEMP/npm-files.txt"
          diff -u .github/npm-files.txt "$RUNNER_TEMP/npm-files.txt" || {
            echo "::error::npm would publish a different file list. Update package.json 'files' or .github/npm-files.txt."
            exit 1
          }
