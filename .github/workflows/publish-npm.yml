# Publishes the npm packages a Release run packed, web then React, with npm trusted
# publishing. It starts when Release succeeds for a version tag, and by hand with a released
# version, to publish that version again (README → Publish → Failed or partial releases).
# It runs no build: it checks out the tag's commit and takes the packages from that Release
# run's prism-release artifact, which only Release's release job uploads (release.yml).
# release-publish.mjs stops unless each package's sha1 is the one Release packed, and a
# version npm already has is verified, not published again.
name: Publish npm

on:
  workflow_run:
    workflows: [Release]
    types: [completed]
  workflow_dispatch:
    inputs:
      version:
        description: The released version to publish, X.Y.Z or X.Y.Z-rc.N
        required: true
        type: string

permissions: {}

concurrency:
  group: prism-publish-npm
  cancel-in-progress: false

jobs:
  npm:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      startsWith(github.event.workflow_run.head_branch, 'v'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      # .github/release-run.mjs, which finds the Release run and checks it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github
      - name: The Release run of the tag
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_RUN: ${{ toJSON(github.event.workflow_run) }}
          VERSION: ${{ inputs.version }}
        run: node .github/release-run.mjs
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.release.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .tool-versions
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: prism-release
          run-id: ${{ steps.release.outputs.run-id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/prism-release
      - name: Publish web then React with npm trusted publishing
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          NPM_PACKAGES: ${{ runner.temp }}/prism-release/npm-packages
        run: node .github/release-publish.mjs
