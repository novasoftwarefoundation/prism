# A version tag's release: the checks, every package built, and the GitHub release with the
# design-tools files, the Webflow bundle and the Kotlin bundle attached. It publishes nothing
# else: each target has a workflow of its own, which starts when this one succeeds for a
# version tag and publishes what this run built, from its prism-release artifact (README →
# Publish): publish-npm.yml, publish-swift.yml and publish-maven-central.yml.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

# Every run waits its turn: with the default queue, a run joining the group would cancel the
# one already waiting, and that version would quietly go unpublished.
concurrency:
  group: prism-release
  cancel-in-progress: false
  queue: max

jobs:
  checks:
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/ci.yml

  # Webflow's CLI and its build tree run here, with read access only, never in the job
  # that can write: that job takes the zip as data (ADR 0014). It gives the artifact's id
  # and the zip's sha256, so the release job takes this job's zip and no other: other jobs
  # of the run, such as maven-bundle's Gradle build, can upload artifacts too (ADR 0015).
  webflow:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
      sha256: ${{ steps.digest.outputs.sha256 }}
    permissions:
      contents: read
    defaults:
      run:
        working-directory: targets/webflow
    env:
      DO_NOT_TRACK: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .tool-versions
      - name: Bundle the Webflow Designer Extension
        run: |
          npm ci
          npm run bundle
          mv bundle.zip prism-tokens-webflow.zip
      - name: The zip's digest
        id: digest
        run: echo "sha256=$(openssl dgst -sha256 prism-tokens-webflow.zip | sed 's/.*= //')" >> "$GITHUB_OUTPUT"
      - id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: prism-tokens-webflow
          path: targets/webflow/prism-tokens-webflow.zip
          if-no-files-found: error
          retention-days: 30

  # The GitHub release, and the hand-over to the publish workflows. This job builds nothing
  # and runs no package of the build trees: it downloads each building job's artifact by the
  # id that job gave, and stops unless its digest is that job's. Then it attaches the
  # design-tools files, the Webflow zip, the Kotlin bundle and release.json (the tag, its
  # commit, the bundle's digest and each npm file's sha256) to the release, and uploads the npm
  # packages and the Kotlin bundle as one artifact, prism-release. The publish workflows check
  # that artifact against release.json on the release, which only this job can write, never
  # against values inside the artifact, which any job of the run can upload. A run has one
  # artifact of a name: when another job took prism-release first, this upload fails, and the
  # run with it. The artifact keeps its name across attempts, so a repeated job's upload fails
  # too: re-run failed jobs only (README → Failed or partial releases).
  release:
    needs: [checks, webflow, maven-bundle, npm-packages]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require a clean tag from main
        run: |
          test -z "$(git status --porcelain)"
          test "$(git rev-parse HEAD)" = "$(git rev-parse "$RELEASE_TAG^{commit}")"
          git merge-base --is-ancestor HEAD origin/main
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.webflow.outputs.artifact-id }}
          merge-multiple: true
          path: ${{ runner.temp }}/webflow
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.maven-bundle.outputs.artifact-id }}
          merge-multiple: true
          path: ${{ runner.temp }}/prism-release/prism-compose-bundle
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.npm-packages.outputs.artifact-id }}
          merge-multiple: true
          path: ${{ runner.temp }}/prism-release/npm-packages
      # The zip webflow built, and no other, before anything is attached.
      - name: The Webflow bundle is the one the webflow job built
        env:
          WEBFLOW_SHA256: ${{ needs.webflow.outputs.sha256 }}
        run: |
          actual=$(openssl dgst -sha256 "$RUNNER_TEMP/webflow/prism-tokens-webflow.zip" | sed 's/.*= //')
          if [ -z "$WEBFLOW_SHA256" ] || [ "$actual" != "$WEBFLOW_SHA256" ]; then
            echo "::error::The Webflow zip's sha256 is $actual, not the webflow job's ${WEBFLOW_SHA256:-(none)}"
            exit 1
          fi
      - name: The Webflow bundle holds exactly the extension's files
        run: |
          unzip -Z1 "$RUNNER_TEMP/webflow/prism-tokens-webflow.zip" | LC_ALL=C sort > "$RUNNER_TEMP/bundle-files.txt"
          printf '%s\n' index.html panel.js styles.css webflow.json | diff -u - "$RUNNER_TEMP/bundle-files.txt"
      # The bundle maven-bundle built, and no other, as Central requires it.
      - name: The Kotlin bundle is the one the maven-bundle job built
        env:
          MAVEN_BUNDLE_SHA256: ${{ needs.maven-bundle.outputs.sha256 }}
        run: |
          bundle="$RUNNER_TEMP/prism-release/prism-compose-bundle"
          actual=$(.github/kotlin-release.sh --digest "$bundle")
          if [ -z "$MAVEN_BUNDLE_SHA256" ] || [ "$actual" != "$MAVEN_BUNDLE_SHA256" ]; then
            echo "::error::The Kotlin bundle's digest is $actual, not the maven-bundle job's ${MAVEN_BUNDLE_SHA256:-(none)}"
            exit 1
          fi
          .github/kotlin-release.sh --check "${RELEASE_TAG#v}" "$bundle"
      # The packages npm-packages packed, and no others: the sha256 of each file's path and
      # sha256, as that job took it.
      - name: The npm packages are the ones the npm-packages job packed
        env:
          NPM_SHA256: ${{ needs.npm-packages.outputs.sha256 }}
        run: |
          cd "$RUNNER_TEMP/prism-release/npm-packages"
          actual=$(find . -type f | LC_ALL=C sort | xargs openssl dgst -sha256 | openssl dgst -sha256 | sed 's/.*= //')
          if [ -z "$NPM_SHA256" ] || [ "$actual" != "$NPM_SHA256" ]; then
            echo "::error::The npm packages' digest is $actual, not the npm-packages job's ${NPM_SHA256:-(none)}"
            exit 1
          fi
      # What the publish workflows check prism-release against: the tag, its commit, the
      # Kotlin bundle's digest and each npm file's sha256. It goes on the GitHub release, which
      # only this job can write, never into the artifact, which any job of the run can upload.
      - name: The hand-over's digests
        env:
          MAVEN_BUNDLE_SHA256: ${{ needs.maven-bundle.outputs.sha256 }}
        run: |
          cd "$RUNNER_TEMP/prism-release/npm-packages"
          npm_files=$(for file in *; do
            printf '%s\t%s\n' "$file" "$(openssl dgst -sha256 "$file" | sed 's/.*= //')"
          done | jq -R -s 'split("\n") | map(select(length > 0) | split("\t") | {(.[0]): .[1]}) | add')
          jq -n --arg tag "$RELEASE_TAG" --arg commit "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)" \
            --arg maven "$MAVEN_BUNDLE_SHA256" --argjson npm "$npm_files" \
            '{tag: $tag, commit: $commit, mavenBundleSha256: $maven, npm: $npm}' > "$RUNNER_TEMP/release.json"
      - name: Create GitHub release with design assets and bundles
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          kotlin="$RUNNER_TEMP/prism-compose-${RELEASE_TAG#v}-bundle.zip"
          (cd "$RUNNER_TEMP/prism-release/prism-compose-bundle" && zip -qr "$kotlin" .)
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            flags=()
            case "$RELEASE_TAG" in *-rc.*) flags+=(--prerelease) ;; esac
            gh release create "$RELEASE_TAG" --verify-tag --generate-notes "${flags[@]}"
          fi
          gh release upload "$RELEASE_TAG" targets/design-tools/tokens.json \
            targets/design-tools/tokens.css targets/design-tools/overview.svg \
            "$RUNNER_TEMP/webflow/prism-tokens-webflow.zip" "$kotlin" "$RUNNER_TEMP/release.json" --clobber
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: prism-release
          path: ${{ runner.temp }}/prism-release
          if-no-files-found: error
          retention-days: 90

  # The Kotlin library's bundle for Maven Central. Gradle, the Android Gradle plugin, Kotlin's
  # and their plugins (some 190 build-script artifacts) run here, with read access only and no
  # secret, never where the bundle is signed and uploaded: the release job takes the bundle as
  # data, as it takes the Webflow zip, and publish-maven-central.yml takes it from the release
  # job (ADR 0015).
  maven-bundle:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    # The artifact this job uploaded and the bundle's digest, which the release job checks
    # before it attaches or hands on anything: other jobs of the run, such as webflow's npm
    # packages, can upload artifacts too.
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
      sha256: ${{ steps.digest.outputs.sha256 }}
    env:
      RELEASE_TAG: ${{ github.ref_name }}
      GRADLE: "9.9.2"
      ANDROID_PLATFORM: platforms;android-37.1
      ANDROID_BUILD_TOOLS: build-tools;36.0.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "17"
      # The cache main's CI run wrote (ci.yml's kotlin job, the same key: the build files'
      # hash), read only: without it the build downloads everything from Maven Central again
      # and gets rate-limited (HTTP 429).
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          gradle-version: ${{ env.GRADLE }}
          cache-provider: basic
          cache-read-only: true
      - name: Install the Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "$ANDROID_PLATFORM" "$ANDROID_BUILD_TOOLS" >/dev/null
      - name: Build the unsigned bundle
        run: |
          .github/kotlin-release.sh --bundle "${RELEASE_TAG#v}" "$RUNNER_TEMP/prism-compose-bundle"
          .github/kotlin-release.sh --check "${RELEASE_TAG#v}" "$RUNNER_TEMP/prism-compose-bundle"
      - name: The bundle's digest
        id: digest
        run: echo "sha256=$(.github/kotlin-release.sh --digest "$RUNNER_TEMP/prism-compose-bundle")" >> "$GITHUB_OUTPUT"
      - id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: prism-compose-bundle
          path: ${{ runner.temp }}/prism-compose-bundle
          if-no-files-found: error
          retention-days: 30

  # The npm packages, web and React, packed and checked: their versions are the tag's, and
  # each holds exactly the files of its list (.github/npm-files*.txt). React's npm packages
  # run here, with read access only; the release job takes the packages as data, and
  # publish-npm.yml publishes them as they are.
  npm-packages:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
      sha256: ${{ steps.digest.outputs.sha256 }}
    env:
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          version-file: .tool-versions
          version-type: strict
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .tool-versions
      - name: Require a clean tag from main
        run: |
          test -z "$(git status --porcelain)"
          test "$(git rev-parse HEAD)" = "$(git rev-parse "$RELEASE_TAG^{commit}")"
          git merge-base --is-ancestor HEAD origin/main
      - name: Build and check generated output
        working-directory: design
        run: |
          mix deps.get
          mix prism.gen --check
      - name: Build React package
        working-directory: targets/react
        run: npm ci
      - name: Validate versions and exact package contents
        env:
          NPM_PACKAGES: ${{ runner.temp }}/npm-packages
        run: |
          mkdir "$NPM_PACKAGES"
          node .github/release-prepare.mjs
      # The sha256 of each file's path and sha256, which the release job compares.
      - name: The packages' digest
        id: digest
        run: |
          cd "$RUNNER_TEMP/npm-packages"
          echo "sha256=$(find . -type f | LC_ALL=C sort | xargs openssl dgst -sha256 | openssl dgst -sha256 | sed 's/.*= //')" >> "$GITHUB_OUTPUT"
      - id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: prism-npm-packages
          path: ${{ runner.temp }}/npm-packages
          if-no-files-found: error
          retention-days: 30
